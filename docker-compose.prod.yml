services:
  postgres:
    image: postgres:16
    container_name: cloth_inventory_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@123
      POSTGRES_DB: cloth_inventory

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - cloth-network

  backend:
    build:
      context: ./backend

    container_name: cloth_inventory_backend

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    ports:
      - "8000:8000"

    networks:
      - cloth-network

  frontend:
    build:
      context: ./frontend

    container_name: cloth_inventory_frontend

    depends_on:
      - backend

    restart: unless-stopped

    ports:
      - "3000:80"

    networks:
      - cloth-network

volumes:
  postgres_data:

networks:
  cloth-network:
    driver: bridge