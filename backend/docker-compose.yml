services:
  postgres:
    image: postgres:16
  
    container_name: cloth_inventory_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres@123
      POSTGRES_DB: cloth_inventory

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  backend:
    build: .
    container_name: cloth_inventory_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

    volumes:
      - .:/app

    restart: unless-stopped

volumes:
  postgres_data: