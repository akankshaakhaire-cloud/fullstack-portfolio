name: Phase 15.1 - Upgrade GitHub Actions CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create .env
        run: |
          echo "APP_NAME=Cloth Inventory API" > .env
          echo "APP_VERSION=1.0.0" >> .env
          echo "DEBUG=True" >> .env
          echo "HOST=127.0.0.1" >> .env
          echo "PORT=8000" >> .env
          echo "DATABASE_URL=sqlite:///./test.db" >> .env
          echo "TEST_DATABASE_URL=sqlite:///./test.db" >> .env
          echo "SECRET_KEY=test_secret_key" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        run: pytest

      - name: Verify FastAPI Import
        run: |
          python -c "from app.main import app; print('FastAPI application loaded successfully')"

      - name: Build Backend Docker Image
        run: docker build -t cloth-inventory-backend .

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build